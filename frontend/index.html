<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📋 Task Manager</h1>

    <form id="task-form">
      <input type="text" id="title" placeholder="عنوان المهمة" required />
      <input type="text" id="description" placeholder="وصف (اختياري)" />
      <button type="submit">إضافة</button>
    </form>

    <ul id="task-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
