name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Init database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d taskdb -f db/init.sql

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          DB_HOST: localhost

  build-images:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t task-manager-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t task-manager-frontend:latest ./frontend

      # لو عندك حساب Docker Hub، ضيف الخطوات دي:
